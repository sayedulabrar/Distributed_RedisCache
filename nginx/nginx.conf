# Run nginx worker processes as the nginx user
user nginx;

# Automatically set number of worker processes based on CPU cores
worker_processes auto;

# Path and log level for nginx error logs
error_log /var/log/nginx/error.log warn;

# File that stores the nginx master process ID
pid /var/run/nginx.pid;

events {
    # Maximum simultaneous connections per worker process
    worker_connections 1024;

    # Use epoll event method (efficient for Linux systems)
    use epoll;
}

http {

    # Load MIME type mappings (file extensions → content type)
    include /etc/nginx/mime.types;

    # Default content type if not matched
    default_type application/octet-stream;

    # Custom log format including request and upstream timing metrics
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # Location of access logs and the format used
    access_log /var/log/nginx/access.log main;

    # Enable zero-copy file transfers for better performance
    sendfile on;

    # Optimize packet transmission for large responses
    tcp_nopush on;

    # Send packets immediately without buffering delays
    tcp_nodelay on;

    # Keep client connections alive for 65 seconds
    keepalive_timeout 65;

    # Maximum size of MIME type hash table
    types_hash_max_size 2048;

    # Enable gzip compression for responses
    gzip on;

    # Add Vary header for proxies when gzip is used
    gzip_vary on;

    # Allow gzip compression for proxied requests
    gzip_proxied any;

    # Compression level (1 = fast, 9 = best compression)
    gzip_comp_level 6;

    # File types that should be compressed
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss;

    # Define a group of backend API servers for load balancing
    upstream api_backend {

        # Use least connections algorithm for load balancing
        least_conn;
        
        # Backend API server instance 1
        # max_fails: mark server down after 3 failures
        # fail_timeout: disable it for 30 seconds
        server api-server-1:4000 max_fails=3 fail_timeout=30s;

        # Backend API server instance 2
        server api-server-2:4000 max_fails=3 fail_timeout=30s;

        # Backend API server instance 3
        server api-server-3:4000 max_fails=3 fail_timeout=30s;
        
        # Maintain up to 32 idle keepalive connections to backend servers
        keepalive 32;
    }

    # Main HTTP server configuration
    server {

        # Listen for incoming HTTP requests on port 80
        listen 80;

        # Default catch-all server name
        server_name _;

        # Maximum allowed request body size
        client_max_body_size 10M;

        # Timeout for reading client request body
        client_body_timeout 60s;

        # Timeout for reading client request headers
        client_header_timeout 60s;

        # Use HTTP/1.1 when communicating with upstream servers
        proxy_http_version 1.1;

        # Remove Connection header to support keepalive with upstream
        proxy_set_header Connection "";

        # Pass original host header to backend
        proxy_set_header Host $host;

        # Forward real client IP address
        proxy_set_header X-Real-IP $remote_addr;

        # Forward full client IP chain (for proxies/load balancers)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Forward original request protocol (http/https)
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout for connecting to upstream server
        proxy_connect_timeout 5s;

        # Timeout for sending request to upstream
        proxy_send_timeout 60s;

        # Timeout for reading response from upstream
        proxy_read_timeout 60s;

        # Default route for all requests
        location / {

            # Forward request to the upstream API backend pool
            proxy_pass http://api_backend;
            
            # Add header showing total request processing time
            add_header X-Response-Time $request_time;

            # Add header showing which upstream server handled request
            add_header X-Upstream-Server $upstream_addr;
        }

        # Health check endpoint
        location /health {

            # Forward health check request to backend health endpoint
            proxy_pass http://api_backend/health;
        }

        # Metrics endpoint for monitoring systems
        location /metrics {

            # Forward metrics request to backend metrics endpoint
            proxy_pass http://api_backend/metrics;
        }
    }

    # Separate server for nginx internal monitoring
    server {

        # Listen on port 8080
        listen 8080;

        # Catch-all server name
        server_name _;

        location /nginx_status {

            # Enable nginx stub status module (connection stats)
            stub_status on;

            # Disable logging for this endpoint
            access_log off;
        }
    }
}